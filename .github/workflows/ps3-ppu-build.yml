name: PS3 VPN Manager - PPU Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ps3-vpn-manager-source-v2.3.zip"
      - ".github/workflows/ps3-ppu-build.yml"

permissions:
  contents: read

jobs:
  ppu-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PS3DEV: ${{ github.workspace }}/sdk-builder/ps3dev
      PSL1GHT: ${{ github.workspace }}/sdk-builder/ps3dev

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout official PS3DEV build scripts
        uses: actions/checkout@v4
        with:
          repository: ps3dev/ps3dev
          path: sdk-builder

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ps3-vpn-manager-source-v2.3.zip"
          test -f "$ZIP" || {
            echo "::error::Arquivo-fonte não encontrado: $ZIP"
            exit 1
          }
          ls -lh "$ZIP"
          sha256sum "$ZIP"
          unzip -t "$ZIP"
          mkdir -p "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/output"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/source"
          echo "Arquivos extraídos:"
          find "$GITHUB_WORKSPACE/source" -maxdepth 5 -type f | sort | head -250

      - name: Install official PS3DEV host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc libelf-dev autoconf automake bison flex make texinfo \
            patch wget zlib1g-dev libtool-bin bzip2 pkg-config libssl-dev

      - name: Download and install official prebuilt PPU/SPU toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="ps3dev-linux-X64.tar.gz"
          TOOLCHAIN_URL="$(gh api repos/ps3dev/ps3toolchain/releases \
            --jq '
              map(select(.prerelease and (.draft | not)))
              | sort_by(.published_at)
              | reverse
              | .[0].assets[]
              | select(.name == "ps3dev-linux-X64.tar.gz")
              | .browser_download_url
            ')"
          if [ -z "$TOOLCHAIN_URL" ]; then
            echo "::error::Não foi encontrado um pacote Linux X64 nas releases oficiais do ps3toolchain."
            exit 1
          fi
          echo "Baixando toolchain oficial: $TOOLCHAIN_URL"
          curl --fail --location --retry 3 --retry-delay 2 "$TOOLCHAIN_URL" \
            --output "$RUNNER_TEMP/$ASSET"
          tar -tzf "$RUNNER_TEMP/$ASSET" | sed -n '1,20p'
          tar -xzf "$RUNNER_TEMP/$ASSET" -C "$GITHUB_WORKSPACE/sdk-builder"
          test -x "$PS3DEV/ppu/bin/ppu-gcc" || {
            echo "::error::ppu-gcc não foi encontrado no pacote oficial."
            exit 1
          }
          test -x "$PS3DEV/spu/bin/spu-gcc" || {
            echo "::error::spu-gcc não foi encontrado no pacote oficial."
            exit 1
          }
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"
          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PSL1GHT=$PSL1GHT" >> "$GITHUB_ENV"

      - name: Build PSL1GHT and PS3 libraries
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/sdk-builder"
          # The upstream raphnet endpoint currently returns an invalid archive.
          # Redirect only this source to a stable BLFS mirror; download.sh still
          # enforces the official SHA256 before extracting or compiling it.
          python3 - <<'PY'
          from pathlib import Path

          script = Path("scripts/003-ps3libraries.sh")
          content = script.read_text()
          checkout = '''checkout_repository \\
              "$PS3LIBRARIES_REPOSITORY" \\
              "$PS3LIBRARIES_REF" \\
              "$PS3LIBRARIES_SOURCE_DIR"'''
          injection = checkout + '''
          
          sed -i 's#https://mikmod.raphnet.net/files/libmikmod-3.1.11.tar.gz#https://mirror.metanet.ch/BLFS/conglomeration/libmikmod/libmikmod-3.1.11.tar.gz#' \\
              "$PS3LIBRARIES_SOURCE_DIR/archives/archives.txt"
          '''
          if "mirror.metanet.ch/BLFS/conglomeration/libmikmod" not in content:
              if checkout not in content:
                  raise SystemExit("Não foi possível localizar o checkout oficial do ps3libraries.")
              content = content.replace(checkout, injection, 1)
              script.write_text(content)
          PY
          ./build-all.sh 2 3
          command -v ppu-gcc
          command -v spu-gcc
          ppu-gcc --version | head -n 1
          spu-gcc --version | head -n 1

      - name: Patch application Makefile build target
        shell: bash
        run: |
          set -euo pipefail
          APP_MAKEFILE="$(find "$GITHUB_WORKSPACE/source" -type f -path '*/app/Makefile' -print -quit)"
          if [ -z "$APP_MAKEFILE" ]; then
            echo "::error::app/Makefile não encontrado no arquivo-fonte."
            exit 1
          fi
          python3 - "$APP_MAKEFILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          if "all: $(OFILES)" in content:
              print("O alvo all já existe; nenhuma alteração necessária.")
          else:
              old = "else\nDEPENDS := $(OFILES:.o=.d)"
              new = "else\nall: $(OFILES)\n\nDEPENDS := $(OFILES:.o=.d)"
              if old not in content:
                  raise SystemExit("Não foi possível localizar com segurança o bloco esperado no Makefile.")
              path.write_text(content.replace(old, new, 1))
              print("Alvo all corrigido.")
          PY
          grep -n -A3 -B2 'all: $(OFILES)' "$APP_MAKEFILE"

      - name: Compile application ELF and SELF
        shell: bash
        run: |
          set -euo pipefail
          APP_MAKEFILE="$(find "$GITHUB_WORKSPACE/source" -type f -path '*/app/Makefile' -print -quit)"
          test -n "$APP_MAKEFILE"
          APP_DIR="$(dirname "$APP_MAKEFILE")"
          echo "Diretório do aplicativo: $APP_DIR"
          make -C "$APP_DIR" clean
          make -C "$APP_DIR" -j2
          ELF="$(find "$APP_DIR" -type f -name '*.elf' -print -quit)"
          SELF="$(find "$APP_DIR" -type f -name '*.self' -print -quit)"
          test -n "$ELF" || {
            echo "::error::A compilação não gerou ELF."
            exit 1
          }
          test -n "$SELF" || {
            echo "::error::A compilação não gerou SELF."
            exit 1
          }
          cp "$ELF" "$GITHUB_WORKSPACE/output/"
          cp "$SELF" "$GITHUB_WORKSPACE/output/"
          file "$GITHUB_WORKSPACE/output/"*

      - name: Create and validate installable PKG
        shell: bash
        run: |
          set -euo pipefail
          APP_MAKEFILE="$(find "$GITHUB_WORKSPACE/source" -type f -path '*/app/Makefile' -print -quit)"
          test -n "$APP_MAKEFILE"
          APP_DIR="$(dirname "$APP_MAKEFILE")"
          make -C "$APP_DIR" pkg
          PKG="$(find "$APP_DIR" -type f -name '*.pkg' -print -quit)"
          test -n "$PKG" || {
            echo "::error::O alvo pkg terminou sem gerar um arquivo .pkg."
            exit 1
          }
          cp "$PKG" "$GITHUB_WORKSPACE/output/"
          ls -lh "$GITHUB_WORKSPACE/output"
          (cd "$GITHUB_WORKSPACE/output" && sha256sum *)

      - name: Upload PS3 build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps3-vpn-manager-ppu-build
          path: output/
          if-no-files-found: warn
          retention-days: 14
